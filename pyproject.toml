[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supportlens"
version = "0.2.0"
description = "An evidence-first support copilot with measurable retrieval and ticket classification."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "pypdf>=5,<8", "scikit-learn>=1.6,<2", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
semantic = ["sentence-transformers>=5,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
supportlens = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
